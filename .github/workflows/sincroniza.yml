name: Sincronizar Dados Supabase

on:
  schedule:
    - cron: '0 3 * * *'  
  workflow_dispatch:      

jobs:
  sincronizacao:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar sincronização de todos os domínios
        env:

          # Segredos do Domínio OPERAÇÕES
          OPERACOES_DATABASE_URL_WRITER: ${{ secrets.OPERACOES_DATABASE_URL_WRITER }}
          OPERACOES_GOOGLE_CREDENTIALS_JSON: ${{ secrets.OPERACOES_GOOGLE_CREDENTIALS_JSON }}
          OPERACOES_PLANILHAS_JSON: ${{ secrets.OPERACOES_PLANILHAS_JSON }}
          OPERACOES_ARQUIVOS_EXCEL_JSON: ${{ secrets.OPERACOES_ARQUIVOS_EXCEL_JSON }}
          
          # Segredos do Domínio TCF
          TCF_DATABASE_URL_WRITER: ${{ secrets.TCF_DATABASE_URL_WRITER }}
          TCF_GOOGLE_CREDENTIALS_JSON: ${{ secrets.TCF_GOOGLE_CREDENTIALS_JSON }}
          TCF_PLANILHAS_JSON: ${{ secrets.TCF_PLANILHAS_JSON }}
          TCF_ARQUIVOS_EXCEL_JSON: ${{ secrets.TCF_ARQUIVOS_EXCEL_JSON }}
        run: python sincroniza_github.py